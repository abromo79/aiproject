{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Enhanced Change List Styling */
    .results {
        background: white !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05) !important;
        overflow: hidden !important;
    }
    
    .results thead th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        padding: 15px 20px !important;
        border: none !important;
    }
    
    .results thead th a {
        color: white !important;
        text-decoration: none !important;
        transition: all 0.3s ease !important;
    }
    
    .results thead th a:hover {
        text-decoration: underline !important;
    }
    
    .results tbody tr {
        transition: all 0.3s ease !important;
        border-bottom: 1px solid rgba(102, 126, 234, 0.1) !important;
    }
    
    .results tbody tr:hover {
        background: rgba(102, 126, 234, 0.05) !important;
        transform: scale(1.01) !important;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1) !important;
    }
    
    .results tbody tr:last-child {
        border-bottom: none !important;
    }
    
    .results tbody td {
        padding: 15px 20px !important;
        vertical-align: middle !important;
    }
    
    .results tbody td a {
        color: #667eea !important;
        font-weight: 600 !important;
        text-decoration: none !important;
        transition: all 0.3s ease !important;
    }
    
    .results tbody td a:hover {
        color: #5a4fcf !important;
        text-decoration: underline !important;
    }
    
    /* Action buttons styling */
    .actions {
        background: rgba(102, 126, 234, 0.05) !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 15px 20px !important;
        margin: 20px 0 !important;
    }
    
    .actions label {
        color: #4b5563 !important;
        font-weight: 600 !important;
        margin-right: 10px !important;
    }
    
    .actions select {
        background: white !important;
        border: 2px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        margin-right: 10px !important;
        transition: all 0.3s ease !important;
    }
    
    .actions select:focus {
        border-color: #667eea !important;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
        outline: none !important;
    }
    
    .actions button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        border: none !important;
        border-radius: 8px !important;
        color: white !important;
        font-weight: 600 !important;
        padding: 8px 16px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }
    
    .actions button:hover {
        background: linear-gradient(135deg, #5a4fcf 0%, #6d28d9 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3) !important;
    }
    
    /* Search form styling */
    #changelist-search {
        background: rgba(102, 126, 234, 0.05) !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 20px !important;
        margin-bottom: 25px !important;
    }
    
    #changelist-search label {
        color: #4b5563 !important;
        font-weight: 600 !important;
        margin-right: 10px !important;
    }
    
    #changelist-search input[type="text"] {
        background: white !important;
        border: 2px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 25px !important;
        padding: 10px 20px !important;
        width: 300px !important;
        transition: all 0.3s ease !important;
    }
    
    #changelist-search input[type="text"]:focus {
        border-color: #667eea !important;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
        outline: none !important;
    }
    
    #changelist-search input[type="submit"] {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
        border: none !important;
        border-radius: 25px !important;
        color: white !important;
        font-weight: 600 !important;
        padding: 10px 20px !important;
        margin-left: 10px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }
    
    #changelist-search input[type="submit"]:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3) !important;
    }
    
    /* Filter styling */
    #changelist-filter {
        background: white !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 20px !important;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05) !important;
    }
    
    #changelist-filter h2 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        padding: 10px 15px !important;
        margin: -20px -20px 15px -20px !important;
        border-radius: 12px 12px 0 0 !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
    }
    
    #changelist-filter h3 {
        color: #4b5563 !important;
        font-size: 12px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        margin: 15px 0 10px 0 !important;
        padding-bottom: 5px !important;
        border-bottom: 1px solid rgba(102, 126, 234, 0.2) !important;
    }
    
    #changelist-filter ul {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    
    #changelist-filter li {
        margin-bottom: 5px !important;
    }
    
    #changelist-filter a {
        color: #6b7280 !important;
        text-decoration: none !important;
        padding: 5px 10px !important;
        border-radius: 6px !important;
        display: block !important;
        transition: all 0.3s ease !important;
    }
    
    #changelist-filter a:hover {
        background: rgba(102, 126, 234, 0.1) !important;
        color: #667eea !important;
        text-decoration: none !important;
    }
    
    #changelist-filter a.selected {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        font-weight: 600 !important;
    }
    
    /* Date hierarchy styling */
    .date-hierarchy {
        background: rgba(102, 126, 234, 0.05) !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 15px 20px !important;
        margin-bottom: 25px !important;
    }
    
    .date-hierarchy a {
        color: #667eea !important;
        text-decoration: none !important;
        font-weight: 600 !important;
        margin-right: 15px !important;
        transition: all 0.3s ease !important;
    }
    
    .date-hierarchy a:hover {
        color: #5a4fcf !important;
        text-decoration: underline !important;
    }
    
    /* Empty list styling */
    .empty-form {
        background: rgba(102, 126, 234, 0.05) !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 40px 20px !important;
        text-align: center !important;
        color: #6b7280 !important;
        font-style: italic !important;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
        .results {
            border-radius: 8px !important;
        }
        
        .results thead th {
            padding: 10px 15px !important;
            font-size: 12px !important;
        }
        
        .results tbody td {
            padding: 10px 15px !important;
        }
        
        #changelist-search input[type="text"] {
            width: 100% !important;
            margin-bottom: 10px !important;
        }
        
        #changelist-filter {
            margin-top: 20px !important;
        }
    }
</style>
{% endblock %}

{% block object-tools-items %}
{{ block.super }}
<style>
    /* Additional object tools styling */
    .object-tools {
        background: rgba(102, 126, 234, 0.05) !important;
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 12px !important;
        padding: 15px 20px !important;
        margin-bottom: 25px !important;
        display: flex !important;
        justify-content: flex-end !important;
        gap: 10px !important;
    }
    
    .object-tools a {
        background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%) !important;
        color: white !important;
        padding: 8px 16px !important;
        border-radius: 8px !important;
        text-decoration: none !important;
        font-weight: 600 !important;
        transition: all 0.3s ease !important;
    }
    
    .object-tools a:hover {
        background: linear-gradient(135deg, #db2777 0%, #e11d48 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3) !important;
        color: white !important;
        text-decoration: none !important;
    }
    
    .object-tools .addlink {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
    }
    
    .object-tools .addlink:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3) !important;
    }
</style>
{% endblock %}
