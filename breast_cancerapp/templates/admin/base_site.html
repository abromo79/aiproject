{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}{{ block.super }}
<style>
    /* Breast Cancer Admin Theme */
    .masthead {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1) !important;
    }
    
    .masthead h1, .masthead a {
        color: white !important;
    }
    
    .masthead .brand {
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
    }
    
    .masthead .brand::before {
        content: '' !important;
        display: inline-block !important;
        width: 40px !important;
        height: 40px !important;
        background-image: url('{% static "assets/images/logo33.png" %}') !important;
        background-size: contain !important;
        background-repeat: no-repeat !important;
        background-position: center !important;
        border-radius: 8px !important;
    }
    
    .nav-sidebar {
        background: linear-gradient(180deg, #f8f9ff 0%, #e8ecff 100%) !important;
        border-right: 1px solid rgba(102, 126, 234, 0.1) !important;
    }
    
    .nav-sidebar .current-model {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1)) !important;
        border-left: 4px solid #667eea !important;
    }
    
    .nav-sidebar a {
        color: #4b5563 !important;
        transition: all 0.3s ease !important;
    }
    
    .nav-sidebar a:hover {
        background: rgba(102, 126, 234, 0.1) !important;
        color: #667eea !important;
        padding-left: 20px !important;
    }
    
    .module th, .module td {
        border-color: rgba(102, 126, 234, 0.1) !important;
    }
    
    .module th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        font-weight: 600 !important;
    }
    
    .module tr:nth-child(even) {
        background: rgba(102, 126, 234, 0.05) !important;
    }
    
    .module tr:hover {
        background: rgba(102, 126, 234, 0.1) !important;
    }
    
    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        border: none !important;
        border-radius: 8px !important;
        color: white !important;
        font-weight: 600 !important;
        transition: all 0.3s ease !important;
    }
    
    .btn:hover {
        background: linear-gradient(135deg, #5a4fcf 0%, #6d28d9 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3) !important;
        color: white !important;
    }
    
    .object-tools a {
        background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%) !important;
        border: none !important;
        border-radius: 8px !important;
        color: white !important;
        font-weight: 600 !important;
    }
    
    .object-tools a:hover {
        background: linear-gradient(135deg, #db2777 0%, #e11d48 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3) !important;
    }
    
    .paginator .current {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        border: none !important;
        color: white !important;
        font-weight: 600 !important;
    }
    
    .paginator a {
        border-color: rgba(102, 126, 234, 0.3) !important;
        color: #667eea !important;
        transition: all 0.3s ease !important;
    }
    
    .paginator a:hover {
        background: rgba(102, 126, 234, 0.1) !important;
        border-color: #667eea !important;
    }
    
    .form-row {
        border-bottom: 1px solid rgba(102, 126, 234, 0.1) !important;
    }
    
    .form-row label {
        color: #4b5563 !important;
        font-weight: 600 !important;
    }
    
    .form-row .help {
        color: #6b7280 !important;
        font-style: italic !important;
    }
    
    .errorlist {
        background: linear-gradient(135deg, rgba(254, 226, 226, 0.95), rgba(254, 202, 202, 0.95)) !important;
        border: 1px solid rgba(252, 165, 165, 0.5) !important;
        color: #dc2626 !important;
        border-radius: 8px !important;
        padding: 12px !important;
        margin: 8px 0 !important;
    }
    
    .success {
        background: linear-gradient(135deg, rgba(220, 252, 231, 0.95), rgba(187, 247, 208, 0.95)) !important;
        border: 1px solid rgba(134, 239, 172, 0.5) !important;
        color: #16a34a !important;
        border-radius: 8px !important;
        padding: 12px !important;
        margin: 8px 0 !important;
    }
    
    /* Medical theme additions */
    .dashboard .module h2 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        border-radius: 8px 8px 0 0 !important;
        padding: 12px 15px !important;
        margin: 0 !important;
    }
    
    .dashboard .module {
        border: 1px solid rgba(102, 126, 234, 0.2) !important;
        border-radius: 8px !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
        margin-bottom: 20px !important;
    }
    
    .dashboard .module ul {
        padding: 15px !important;
    }
    
    .dashboard .module li {
        border-bottom: 1px solid rgba(102, 126, 234, 0.1) !important;
        padding: 8px 0 !important;
    }
    
    .dashboard .module li:last-child {
        border-bottom: none !important;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
        .masthead {
            padding: 10px !important;
        }
        
        .masthead h1 {
            font-size: 18px !important;
        }
        
        .nav-sidebar {
            transform: translateX(-100%) !important;
            transition: transform 0.3s ease !important;
        }
        
        .nav-sidebar.show {
            transform: translateX(0) !important;
        }
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        Breast Cancer AI Admin
    </a>
</h1>
{% endblock %}

{% block nav-global %}{{ block.super }}
<style>
    /* Add medical badge to admin header */
    .masthead::after {
        content: 'Medical AI System';
        position: absolute;
        top: 15px;
        right: 20px;
        background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
</style>
{% endblock %}
